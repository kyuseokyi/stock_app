# ─────────────────────────────────────────────────────────────────────────────
# Secret 예시 — 이 파일은 placeholder 만 담는다. 실값을 여기에 쓰지 마세요!
#   cp deploy/k8s/base/secret.example.yaml deploy/k8s/base/secret.yaml   # secret.yaml 은 .gitignore
#   (secret.yaml 을 실값으로 수정)
#   kubectl apply -f deploy/k8s/base/secret.yaml
# 또는 파일 없이 바로:
#   kubectl -n stock-app create secret generic stock-app-secrets --from-env-file=my.secret.env
#
# Pod 안에서는 /etc/stock-app/secrets/<키> 파일로 보이고, ConfigMap 의 X_FILE 경로로 앱이 읽는다.
# 쓰지 않는 값(예: 카카오 미사용)은 빈 문자열 "" 로 두면 된다(키 자체는 남겨 둘 것).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: stock-app-secrets
  namespace: stock-app
type: Opaque
stringData:
  # DB 비밀번호는 URL 안에 들어간다
  database_url: "postgresql+asyncpg://stock_user:CHANGE_ME@db.example.internal:5432/stock_db"
  sync_database_url: "postgresql+psycopg2://stock_user:CHANGE_ME@db.example.internal:5432/stock_db"
  clickhouse_password: "CHANGE_ME"
  # 모든 서비스가 같은 값이어야 토큰 검증이 된다
  jwt_secret_key: "CHANGE_ME_LONG_RANDOM"
  kis_app_key: ""
  kis_app_secret: ""
  kakao_rest_api_key: ""
  kakao_client_secret: ""
  kakao_admin_key: ""
  naver_client_secret: ""
  social_state_secret: "CHANGE_ME_LONG_RANDOM"
