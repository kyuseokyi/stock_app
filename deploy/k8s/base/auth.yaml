# 인증 API (auth.example.com)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1   # base 는 1. overlays/prod 에서 늘림
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # 새 Pod 가 Ready 된 뒤 옛 Pod 를 내림(무중단)
  template:
    metadata:
      labels:
        app: auth
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: REGISTRY/stock-app-backend:TAG
          command: ["uvicorn", "apps.auth.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: stock-app-config
          volumeMounts:
            - name: app-secrets
              mountPath: /etc/stock-app/secrets
              readOnly: true
          # Ready = DB·Redis 연결 OK → 그때부터 트래픽 받음
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Live = 프로세스 생존(의존성 미검사) → 실패 시 컨테이너 재시작
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # 로드밸런서 목록에서 빠질 시간을 준 뒤 종료(SIGTERM)
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: app-secrets
          secret:
            secretName: stock-app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8001
      targetPort: http
