# PodDisruptionBudget — 노드 점검(drain) 같은 "자발적 중단" 때도 최소 1개는 살아 있게.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
spec:
  minAvailable: 1
  selector: {matchLabels: {app: auth}}
---
