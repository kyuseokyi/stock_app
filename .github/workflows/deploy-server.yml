name: Deploy Server (Backend & Workers)

# 트리거: main 에 backend 또는 compose 변경이 push 되면 자동, 또는 UI 에서 수동 실행.
# 대상: API 3종 + 트레이딩 게임(trading_game·game_ws) + Celery worker/beat 재빌드·재기동.
#       기동 전 alembic upgrade head 로 스키마를 최신화. 프론트(web_client/admin_web)는 건드리지 않음.
on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "deploy/swarm/**"
  workflow_dispatch:

# 같은 대상 배포가 겹치지 않도록 직렬화(진행 중 배포는 중단하지 않음)
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy APIs & Celery
    runs-on: self-hosted
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Load Production Env from Host (fail if missing)
      run: |
        # 러너는 매 배포마다 git clean(-ffdx)으로 ignored 파일까지 지운다.
        # .env.production 은 체크아웃 밖(호스트 고정 경로)에 두고 매번 복사해 온다.
        # .env.example 폴백은 "성공처럼 보이는 깨진 배포"를 만들므로 금지 → 없으면 실패.
        HOST_ENV=/opt/stock_app/env
        if [ ! -f "$HOST_ENV/.env.production" ]; then
          echo "::error::$HOST_ENV/.env.production not found on host. See docs/server_setup.md (§3)."
          exit 1
        fi
        cp "$HOST_ENV/.env.production" backend/.env.production
        if [ -f "$HOST_ENV/compose.env" ]; then
          cp "$HOST_ENV/compose.env" .env
        fi

    - name: Detect deploy mode (Swarm stack 'stock' → 무중단, 없으면 compose)
      id: mode
      run: |
        # 전환(deploy/swarm/cutover.sh) 전에는 기존 compose 방식 그대로. 문서: docs/deploy/single-node-swarm.md
        if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] && docker stack ls --format '{{.Name}}' | grep -qx stock; then
          echo "swarm=true" >> "$GITHUB_OUTPUT"; echo "모드: Swarm(start-first)"
        else
          echo "swarm=false" >> "$GITHUB_OUTPUT"; echo "모드: compose"
        fi

    - name: Build, migrate, rolling update (Swarm, 무중단)
      if: steps.mode.outputs.swarm == 'true'
      run: bash deploy/swarm/deploy.sh backend "${GITHUB_SHA:0:12}"

    - name: Build backend images
      if: steps.mode.outputs.swarm != 'true'
      run: |
        docker compose -f docker-compose.prod.yml build \
          auth_api stock_api blog_api trading_game game_ws celery_worker celery_beat

    - name: Migrate PostgreSQL schema (alembic upgrade head)
      if: steps.mode.outputs.swarm != 'true'
      run: |
        # 새 이미지로 마이그레이션을 먼저 적용한다(멱등 — 이미 최신이면 no-op).
        # 실패하면 이 스텝에서 배포가 중단되어 구 컨테이너가 그대로 유지된다.
        docker compose -f docker-compose.prod.yml run --rm stock_api alembic upgrade head

    - name: Deploy backend services
      if: steps.mode.outputs.swarm != 'true'
      run: |
        echo "🚀 Deploying backend (APIs + Game + Celery)…"
        # 지정 서비스만 재생성. DB(postgres/clickhouse/redis)는 depends_on 으로
        # 필요 시 기동되며 이미 healthy 면 no-op(볼륨·데이터 보존). 프론트는 미포함 → 무영향.
        docker compose -f docker-compose.prod.yml up -d \
          auth_api stock_api blog_api trading_game game_ws celery_worker celery_beat
        echo "✅ Backend deploy done"

    - name: Cleanup dangling images
      if: always()
      run: |
        docker image prune -f
        echo "🧹 dangling 이미지 정리 완료"
